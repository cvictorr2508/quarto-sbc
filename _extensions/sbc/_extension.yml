title: SBC
author: Victor Rafael Celestino
version: 0.1.0-dev
quarto-required: ">=1.6.0"
contributes:
  formats:
    common:
      toc: false
    pdf:
      documentclass: article
      fontsize: 12pt
      papersize: a4
      pdf-engine: pdflatex
      template: template.tex
      keep-tex: true
      cite-method: biblatex
    html:
      theme: cosmo
      toc: true
      number-sections: true
