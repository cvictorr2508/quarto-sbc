name: Validate Quarto SBC manuscript

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Check Quarto installation
        run: quarto check

      - name: Render complete manuscript project
        run: quarto render

      - name: Prepare SBC PDF regression inputs
        run: |
          test -s _manuscript/index.pdf
          mkdir -p artifacts

          tex_path="$(
            find . \
              -type f \
              -name 'index.tex' \
              -not -path './.git/*' \
              -print -quit
          )"
          test -n "$tex_path"
          echo "Generated TeX: $tex_path"
          cp "$tex_path" artifacts/index.tex

          pdfinfo _manuscript/index.pdf > artifacts/index-pdfinfo.txt
          pdftotext -layout _manuscript/index.pdf artifacts/index.txt
          pdftoppm \
            -f 1 \
            -singlefile \
            -png \
            -r 144 \
            _manuscript/index.pdf \
            artifacts/sbc-first-page

      - name: Validate SBC PDF editorial structure
        run: |
          python3 scripts/check_sbc_pdf.py \
            --pdfinfo artifacts/index-pdfinfo.txt \
            --text artifacts/index.txt \
            --tex artifacts/index.tex

      - name: Upload SBC first-page preview
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbc-first-page-preview
          path: artifacts/sbc-first-page.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBC regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbc-regression-diagnostics
          path: |
            artifacts/index.tex
            artifacts/index.txt
            artifacts/index-pdfinfo.txt
          if-no-files-found: error
          retention-days: 14

      - name: Validate extension installation downstream
        run: |
          rm -rf /tmp/quarto-sbc-downstream
          mkdir -p /tmp/quarto-sbc-downstream
          cd /tmp/quarto-sbc-downstream

          quarto create project manuscript . --no-prompt
          quarto add cvictorr2508/quarto-sbc --no-prompt

          cat > index.qmd <<'EOF'
          ---
          title: "SBC downstream smoke test"
          author:
            - name: Test Author
          abstract: |
            Downstream extension installation smoke test.
          resumo: |
            Teste de instalação downstream da extensão.
          format:
            sbc-pdf: default
          ---

          # Introduction

          SBC extension portability smoke test.
          EOF

          quarto render index.qmd --to sbc-pdf

          pdf_path="$(
            find /tmp/quarto-sbc-downstream \
              -type f \
              -name 'index.pdf' \
              -size +0c \
              -print -quit
          )"

          test -n "$pdf_path"
          echo "Downstream SBC PDF: $pdf_path"
